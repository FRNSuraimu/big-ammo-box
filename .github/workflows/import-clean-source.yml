name: Import BAB Clean Source

on:
  push:
    branches:
      - temp-clean-source-import-20260908

permissions:
  contents: write

jobs:
  import-clean-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate clean source
        shell: bash
        env:
          CLEAN_SOURCE_ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-1b48-8206-9570-6362d9c248e9/raw?se=2026-09-07T18%3A02%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=8bf5d405-9b64-5d46-bb15-2aab88c06467&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T01%3A06%3A30Z&ske=2026-09-08T01%3A06%3A30Z&sks=b&skv=2026-02-06&sig=8ae0129E1D543Zyg4uWtOzTHLgst7lcmUeH/Um%2BlwOQ%3D'
        run: |
          set -euo pipefail
          rm -rf /tmp/bab-artifact /tmp/bab-clean /tmp/bab-buildtest
          mkdir -p /tmp/bab-artifact /tmp/bab-clean

          curl --fail --location --retry 3 --retry-delay 2 "$CLEAN_SOURCE_ARTIFACT_URL" -o /tmp/bab-artifact.zip
          unzip -q /tmp/bab-artifact.zip -d /tmp/bab-artifact
          source_zip="$(find /tmp/bab-artifact -maxdepth 2 -type f -name 'big-ammo-box-1.0.0-clean-source.zip' | head -n 1)"
          test -n "$source_zip"
          echo "c9bfa6aa10183a9de8045c06bcd47fb485bc6a1f7b47ac6dec66f81eb6ccbd10  $source_zip" | sha256sum -c -
          unzip -q "$source_zip" -d /tmp/bab-clean

          test -f /tmp/bab-clean/src/main/java/com/bigammobox/BigAmmoBoxMod.java
          test -f /tmp/bab-clean/src/main/resources/META-INF/mods.toml
          test -f /tmp/bab-clean/ASSET_LICENSE.md
          test -f /tmp/bab-clean/THIRD_PARTY_NOTICES.md
          test -f /tmp/bab-clean/LICENSE
          test -f /tmp/bab-clean/.github/workflows/build.yml
          grep -Fq 'mod_version=1.0.0' /tmp/bab-clean/gradle.properties
          grep -Fq 'mod_authors=FRNSuraimu | \u958b\u767a\u652f\u63f4: OpenAI (Development Assistance: OpenAI)' /tmp/bab-clean/gradle.properties

          if find /tmp/bab-clean -type f -name '*.zip' | grep -q .; then
            echo 'Unexpected ZIP found inside clean source.' >&2
            exit 1
          fi
          if find /tmp/bab-clean -type f | grep -E 'source-export|0\.1\.[0-9].*complete-source|RUNTIME_CHECK|STATIC_VALIDATION|VALIDATION_|IMPLEMENTATION_|BUILD_STATUS_' ; then
            echo 'Unexpected internal/development artifact found in clean source.' >&2
            exit 1
          fi
          if grep -R -E 'ring_21b|ring_compressed|ring_netherite|ring_nether_star' /tmp/bab-clean/src; then
            echo 'Removed TaCZ-derived ring asset/reference reappeared.' >&2
            exit 1
          fi

          cp -a /tmp/bab-clean /tmp/bab-buildtest

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          build-root-directory: /tmp/bab-buildtest

      - name: Build clean source before promotion
        shell: bash
        working-directory: /tmp/bab-buildtest
        run: |
          set -euo pipefail
          mkdir -p libs
          url='https://www.cursemaven.com/curse/maven/timeless-and-classics-zero-1028108/8141310/timeless-and-classics-zero-1028108-8141310.jar'
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o libs/tacz-1.20.1.jar
          test -s libs/tacz-1.20.1.jar
          jar tf libs/tacz-1.20.1.jar >/dev/null
          gradle --no-daemon build
          find build/libs -maxdepth 1 -type f -name '*.jar' -print -exec sha256sum {} \;

      - name: Promote clean source to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/bab-clean/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Import BIG AMMO BOX 1.0.0 clean source'
          git push origin HEAD:main
